  .pixFloat { animation: pixFloat 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pixFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
  .blink { animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
</style>
