name: Generate Botanical Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/wrap_snake_card.py"
      - ".github/workflows/generate-snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate raw contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Polymath000
          outputs: |
            dist/github-contribution-grid-snake-raw.svg?palette=github-light&color_snake=#E06D44&color_dots=#ECE8DD,#D9F0E6,#74B89B,#1F6F54,#1B2A22

      - name: Restyle snake into Botanical Oat card
        run: python3 scripts/wrap_snake_card.py dist/github-contribution-grid-snake-raw.svg assets/contribution_snake.svg

      - name: Commit updated snake SVG to main
        run: |
          if git diff --quiet assets/contribution_snake.svg; then
            echo "No contribution snake changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution_snake.svg
          git commit -m "chore: update Botanical Oat contribution snake [skip ci]"
          git push
